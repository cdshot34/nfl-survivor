name: Reveal picks

# Unseals each week's picks once its deadline has passed.
#
# Hourly, not every 15 minutes. The job itself takes ~15 seconds, but GitHub sometimes makes
# jobs queue for a runner. On a 15-minute cron a queued job was still waiting when the next one
# arrived, and the concurrency group cancelled it — which reports as a failed run and sends an
# alert, every 15 minutes, for a job that never started. Hourly leaves an hour of slack, and
# there is no concurrency group to cancel anything.
#
# A deadline is 12 hours before the week's first kickoff, so up to an hour of lag costs nothing.
# admin.html has a Reveal now button when you don't want to wait.
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      check_key:
        description: 'Check that REVEAL_KEY matches your picks'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: reveal
        run: node scripts/reveal.js
        env:
          REVEAL_KEY: ${{ secrets.REVEAL_KEY }}
          CHECK_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.check_key) && '1' || '0' }}

      - name: Commit revealed picks
        if: always() && steps.reveal.outputs.weeks != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks.json data/sealed.json
          git commit -m "Reveal week ${{ steps.reveal.outputs.weeks }} picks"
          # Someone may have saved picks from admin.html while this ran.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
